<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">XXD Panel 095</title>
  <desc id="desc">Mid-century diagrammatic editorial illustration with black technical lines, red spot colour, modular pictograms and vintage print texture.</desc>
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="95" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.19" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.7" fill="#32302d" opacity=".17"/>
      <circle cx="6" cy="5" r="0.55" fill="#32302d" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#f4eddd"/>
  <rect width="1200" height="420" fill="url(#grain)" opacity=".12"/>
  <g transform="translate(62 48)" fill="none" stroke="#171817" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="460" height="322" stroke-width="1.3"/>
    <path d="M26 246 H188 V74 H340 V246 H434" stroke-width="2.2"/>
    <path d="M26 272 H434 M26 298 H434" stroke-width=".8" opacity=".55"/>
    <path d="M54 214 L118 152 L166 196 L232 116 L294 171 L364 88 L418 130" stroke-width="2.4"/>
    <path d="M54 214 L54 248 M118 152 L118 248 M166 196 L166 248 M232 116 L232 248 M294 171 L294 248 M364 88 L364 248" stroke-width=".7" stroke-dasharray="3 5"/>
    <circle cx="54" cy="214" r="7" fill="#d9342b" stroke="none"/><circle cx="232" cy="116" r="7" fill="#d9342b" stroke="none"/><circle cx="364" cy="88" r="7" fill="#d9342b" stroke="none"/>
    <path d="M305 275 h84 M305 287 h58" stroke-width="1.1"/>
    <text x="24" y="30" fill="#d9342b" stroke="none" font-family="Courier New,monospace" font-size="12" letter-spacing="2">PLATE 095 / FIELD NOTE</text>
    <text x="22" y="314" fill="#171817" stroke="none" font-family="Courier New,monospace" font-size="11" letter-spacing="1.5">SOURCE → SHORTHAND → RELATION</text>
  </g>
  <line x1="590" y1="56" x2="590" y2="364" stroke="#383a36" stroke-width="1" opacity=".14"/>
  <text x="670" y="80" font-family="Apple Color Emoji, sans-serif" font-size="22">&#x1F981;</text>
  <g font-family="Inter, Avenir Next, Helvetica Neue, Arial, sans-serif" fill="#343632">
    <text x="704" y="80" font-size="22" letter-spacing="5">XXD</text>
    <text x="670" y="148" font-size="54" font-weight="700" letter-spacing="2">PANEL 095</text>
    <text x="670" y="194" font-size="16" letter-spacing="2.1">TECHNICAL LINE · PICTOGRAPHIC SHORTHAND</text>
    <text x="670" y="223" font-size="16" letter-spacing="1.8">BLACK / RED SPOT · MODULAR EDITORIAL</text>
    <text x="670" y="276" font-size="15">技术细线 · 图解简化 · 黑红专色</text>
    <text x="670" y="303" font-size="15">図解線 · 도식적 선 · خط تقني</text>
    <text x="670" y="355" font-size="13" letter-spacing="1.3" fill="#777970">MID-CENTURY DIAGRAM · VINTAGE PRINT</text>
  </g>
</svg>
